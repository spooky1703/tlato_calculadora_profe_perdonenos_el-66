<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250"><rect width="600" height="250" rx="12" fill="#f1f4f8"/><g font-family="sans-serif" fill="#252a34"><text x="30" y="35" font-size="18">Tlato · Interpreta la solución</text><text x="45" y="80" font-size="18">Solución única</text><text x="45" y="125" font-size="22">x₁ = 2</text><text x="45" y="165" font-size="22">x₂ = 1</text><text x="45" y="205" font-size="22">x₃ = 1</text><text x="290" y="125">Comprobación:</text><text x="290" y="165">2 + 1 = 3</text><text x="290" y="200">1 + 1 = 2</text></g></svg>